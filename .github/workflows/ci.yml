name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit and integration tests. Testcontainers uses the runner's Docker.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build image
        run: docker build -t opscenter:${{ github.sha }} .
