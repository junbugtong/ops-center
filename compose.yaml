name: opscenter

services:
  postgres:
    # Keep in step with TestcontainersConfiguration.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opscenter
      POSTGRES_USER: opscenter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opscenter}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscenter -d opscenter"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API as a container too.  docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/opscenter
      DB_USERNAME: opscenter
      DB_PASSWORD: ${DB_PASSWORD:-opscenter}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
